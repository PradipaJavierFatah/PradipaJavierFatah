name: Update Most Used Languages

on:
  workflow_dispatch:
  schedule:
    - cron: "25 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Generate the language card
        run: node scripts/generate-top-languages.mjs
        env:
          LANGUAGE_STATS_TOKEN: ${{ secrets.LANGUAGE_STATS_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}

      - name: Publish the generated SVG
        run: |
          test -s profile/most-used-languages.svg
          git config user.name "Javier"
          git config user.email "114148990+PradipaJavierFatah@users.noreply.github.com"
          git add profile/most-used-languages.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update Most Used Languages card"
          git push
